# Mosquitto bench broker for Network-Power-Switch (MQTT over TLS only).
# Started by tools/broker/run_broker.sh; files mounted at /mosquitto/config.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/out/passwd
acl_file /mosquitto/config/acl

listener 8883
cafile   /mosquitto/config/out/ca.crt
certfile /mosquitto/config/out/server.crt
keyfile  /mosquitto/config/out/server.key
# Devices authenticate with username/password, not client certificates.
require_certificate false

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
